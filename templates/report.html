{% extends "base.html" %}

{% block title %}CV Analysis Results{% endblock %}

{% block head %}
<style>
    .report-container {
        background-color: #1c1b19;
        color: #f4f1ea;
        border: 1px solid #3a3834;
        border-radius: 8px;
        padding: 30px;
    }
    .report-container h1,
    .report-container h2,
    .report-container h3,
    .report-container p,
    .report-container li,
    .report-container td,
    .report-container th {
        color: #f4f1ea;
    }
    .report-container a { color: #e7c27a; }
    .report-container table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0 1.5rem;
    }
    .report-container th,
    .report-container td {
        border: 1px solid #3a3834;
        padding: 0.6rem 0.75rem;
        vertical-align: top;
    }
    .report-container th { background: #2a2825; }
    .report-container pre,
    .report-container code {
        background: #141311;
        color: #f4f1ea;
        border-radius: 4px;
    }
    .report-container pre {
        padding: 1rem;
        overflow-x: auto;
        white-space: pre-wrap;
    }
    .report-container hr { border-color: #3a3834; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.submit_cv') }}">Home</a></li>
                <li class="breadcrumb-item active">Analysis Results</li>
            </ol>
        </nav>
        
        <div class="report-container">
            <h1 class="mb-4">CV Analysis Results</h1>
            
            <!-- Analysis Content -->
            <div class="row">
                <div class="col-12">
                    {{ report_content|safe }}
                </div>
            </div>
            
            <hr class="my-4">
            
            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> New Analysis
                </a>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('report.download_docx', report_id=report_id) }}" class="btn btn-primary">
                        Download CV (.docx)
                    </a>
                    <a href="{{ url_for('report.download_report', report_id=report_id) }}" class="btn btn-outline-secondary">
                        Download report
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
